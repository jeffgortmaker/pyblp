[tox]
envlist = flake8, mypy, tests, notebooks, docs, docs-latex, docs-linkcheck

[testenv]
basepython = python3.12
allowlist_externals = python

[testenv:flake8]
description = Enforce style guidelines.
skip_install = True
deps = flake8==7.4.1
commands = flake8

[testenv:mypy]
description = Check types.
skip_install = True
deps = mypy==2.4.0
commands = mypy .

[testenv:tests]
description = Run the test suite.
passenv =
    KNITRODIR
    ARTELYS_LICENSE
    LD_LIBRARY_PATH
extras = tests
commands = pytest -x -r s {posargs:-n 5}

[testenv:notebooks]
description = Re-execute the documentation notebooks in place.
deps =
    nbconvert
    ipykernel
    matplotlib
    pandas
commands =
    jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=-1 docs/notebooks/api/*.ipynb
    jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=-1 docs/notebooks/tutorial/*.ipynb

[testenv:docs]
description = Build the documentation.
basepython = python3.6
extras = docs
changedir = docs
commands = sphinx-build -E -d _build/html-doctrees -b html . _build/html

[testenv:docs-latex]
description = Build a LaTeX version of the documentation.
basepython = {[testenv:docs]basepython}
extras = {[testenv:docs]extras}
changedir = {[testenv:docs]changedir}
allowlist_externals =
    pdflatex
    makeindex
commands =
    sphinx-build -E -d _build/latex-doctrees -b latex . _build/latex
    pdflatex -quiet -halt-on-error -interaction=nonstopmode -include-directory=_build/latex -output-directory=_build/latex _build/latex/pyblp.tex
    makeindex -s _build/latex/python.ist -o _build/latex/pyblp.ind _build/latex/pyblp.idx
    pdflatex -quiet -halt-on-error -interaction=nonstopmode -include-directory=_build/latex -output-directory=_build/latex _build/latex/pyblp.tex

[testenv:docs-linkcheck]
description = Test external links in the documentation.
basepython = {[testenv:docs]basepython}
extras = {[testenv:docs]extras}
changedir = {[testenv:docs]changedir}
commands = sphinx-build -E -W -d _build/linkcheck-doctrees -b linkcheck . _build/linkcheck

[pytest]
filterwarnings =
    ignore:the matrix subclass:PendingDeprecationWarning
